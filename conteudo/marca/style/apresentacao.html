<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nicolle Nogueira Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1b1917; --ink:#24211e; --cream:#efe8dc; --cru:#e6dccb; --bege:#cdbb9f;
  --amber:#a8733a; --burl:#74492b; --couro:#4f3324; --ocre:#b38641; --marsala:#6b2a2d;
  --muted:#8c8274; --line:rgba(239,232,220,.18);
  --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif; --serif:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f0e0d;overflow:hidden;color:var(--cream);font-family:var(--sans)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{width:1600px;height:900px;position:relative;transform-origin:center center;flex:none}
.slide{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden}
.slide.on{opacity:1;pointer-events:auto}
.dark{background:var(--charcoal);color:var(--cream)}
.light{background:var(--cream);color:var(--ink)}
.cru{background:var(--cru);color:var(--ink)}
.mono{font-family:var(--mono);font-weight:300;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.foot{position:absolute;left:64px;right:64px;bottom:30px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.55}
.head{position:absolute;left:64px;right:64px;top:34px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.6}
/* image cells */
.cell{position:relative;overflow:hidden;background:#2a2622;cursor:zoom-in}
.light .cell,.cru .cell{background:#d9cfbf}
.cell img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s ease, transform 1.2s ease}
.cell img.ok{opacity:1}
.cell:hover img{transform:scale(1.025)}
.grid{position:absolute;left:64px;right:64px;top:78px;bottom:70px;display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.g8{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
.g10{grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr}
.feat{grid-template-columns:1.55fr 1fr 1fr;grid-template-rows:1fr 1fr}
.feat .cell:first-child{grid-row:1/3}
.featR{grid-template-columns:1fr 1fr 1.55fr;grid-template-rows:1fr 1fr}
.featR .cell:nth-child(3){grid-column:3;grid-row:1/3}
.featR .cell:nth-child(1){grid-column:1;grid-row:1}.featR .cell:nth-child(2){grid-column:2;grid-row:1}
.featR .cell:nth-child(4){grid-column:1;grid-row:2}.featR .cell:nth-child(5){grid-column:2;grid-row:2}
.tri{grid-template-columns:1fr 1.3fr 1fr}
.w2{grid-template-columns:1fr 1fr}
.w3{grid-template-columns:1fr 1fr 1fr}
.w4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
/* cover */
.cover-mosaic{position:absolute;inset:0;display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:150px;gap:4px;opacity:.38;filter:saturate(.75)}
.cover-mosaic .cell{cursor:default}
.cover-veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(27,25,23,.55) 0%,rgba(27,25,23,.92) 70%)}
.cover-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover-txt h1{font-family:var(--serif);font-weight:300;font-size:132px;line-height:.95;letter-spacing:-.01em}
.cover-txt h1 em{font-style:italic}
.cover-txt .sub{margin-top:34px}
.cover-txt .rule{width:64px;height:1px;background:var(--cream);opacity:.5;margin:30px auto}
/* text slides */
.txt{position:absolute;left:64px;top:120px;width:620px}
.txt h2{font-family:var(--serif);font-weight:300;font-size:72px;line-height:1;margin:18px 0 36px}
.txt p{font-size:19px;line-height:1.65;font-weight:300;opacity:.86}
.txt p+p{margin-top:18px}
.side-img{position:absolute;top:0;right:0;bottom:0;width:760px}
.side-img .cell{position:absolute;inset:0}
.duo{position:absolute;top:78px;right:64px;bottom:70px;width:760px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
/* chapter opener */
.opener .num{font-family:var(--serif);font-weight:300;font-size:220px;line-height:.8;opacity:.16;position:absolute;left:56px;top:70px}
.opener .txt{top:auto;bottom:110px}
.opener .count{margin-top:34px;opacity:.6}
/* index */
.index{position:absolute;left:64px;right:64px;top:250px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:56px}
.index a{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0;border-top:1px solid rgba(36,33,30,.18);color:inherit;text-decoration:none;cursor:pointer;transition:padding .3s}
.index a:hover{padding-left:8px}
.index .t{font-family:var(--serif);font-size:30px;font-weight:300}
.index .n{font-family:var(--mono);font-size:11px;letter-spacing:.14em;opacity:.55}
/* palette */
.swatches{position:absolute;left:64px;right:64px;top:380px;bottom:110px;display:grid;grid-template-columns:repeat(8,1fr);gap:0}
.sw{display:flex;flex-direction:column;justify-content:flex-end;padding:20px 18px}
.sw b{font-family:var(--serif);font-weight:300;font-size:28px;display:block}
.sw span{font-family:var(--mono);font-size:11px;letter-spacing:.12em;opacity:.7;margin-top:6px}
/* pillars */
.pillars{position:absolute;left:64px;right:64px;top:330px;display:grid;grid-template-columns:repeat(5,1fr);gap:40px}
.pillars div{border-top:1px solid var(--line);padding-top:22px}
.pillars h3{font-family:var(--serif);font-weight:300;font-size:32px;line-height:1.05;margin-bottom:16px}
.pillars p{font-size:15px;line-height:1.6;font-weight:300;opacity:.75}
.names{position:absolute;left:64px;right:64px;top:300px;display:flex;flex-wrap:wrap;align-items:baseline;font-family:var(--serif);font-weight:300;font-size:54px;line-height:1.35}
.names span{white-space:nowrap}
.names i{font-style:normal;opacity:.3;margin:0 18px}
/* chrome */
#bar{position:fixed;left:0;bottom:0;height:2px;background:var(--ocre);transition:width .4s;z-index:5}
#hint{transition:opacity .4s;position:fixed;right:18px;bottom:14px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:#9c9183;opacity:.7;text-transform:uppercase;z-index:5}
#lb{position:fixed;inset:0;background:rgba(10,9,8,.94);display:none;align-items:center;justify-content:center;z-index:10;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:92vw;max-height:92vh;object-fit:contain}
.nav{position:fixed;top:0;bottom:0;width:5vw;z-index:4;cursor:pointer}
#prev{left:0}#next{right:0}
</style>
</head>

  <div class="sw" style="background:#74492b;color:#efe8dc"><b>Burl</b><span>#74492B</span></div>
  <div class="sw" style="background:#4f3324;color:#efe8dc"><b>Couro</b><span>#4F3324</span></div>
  <div class="sw" style="background:#6b2a2d;color:#efe8dc"><b>Marsala</b><span>#6B2A2D</span></div>
  <div class="sw" style="background:#1b1917;color:#efe8dc"><b>Grafite</b><span>#1B1917</span></div>
 </div>${foot('Paleta')}`, 'Paleta');

// ---- References
add('dark', `<div class="head"><span>Fundamentos</span><span>Referências</span></div>
 <div class="txt" style="top:120px;width:900px"><div class="mono">Repertório</div><h2>Quem habita este universo</h2></div>
 <div class="names">${['Kelly Wearstler','Athena Calderone','The Row','Aman','Tadao Ando','Arthur Casas','Flamingo Estate','Goop','Juliana Lima Vasconcellos','Ana Khouri'].map(n=>`<span>${n}</span>`).join('<i>/</i>')}</div>
 ${foot('Referências')}`, 'Referências');

// ---- Index
const idx = add('cru', `<div class="head"><span>Sumário</span><span>${total} imagens</span></div>
 <div class="txt" style="top:110px"><div class="mono">Sumário</div><h2>Treze capítulos</h2></div>
 <div class="index">${CH.map((c,i)=>`<a data-ch="${c.k}"><span class="t">${String(i+1).padStart(2,'0')} &nbsp;${c.t}</span><span class="n">${(DATA[c.k]||[]).length}</span></a>`).join('')}</div>${foot('Sumário')}`, 'Sumário');

// ---- Chapters
const PAT = [['feat',5],['g8',8],['g5',5],['featR',5],['g6',6],['g10',10],['tri',3],['g4',4]];
CH.forEach((c,ci)=>{
  const imgs=(DATA[c.k]||[]).slice();
  const num=String(ci+1).padStart(2,'0');
  const label=`${num} · ${c.t}`;
  const hero=imgs.shift();
  const second = imgs.length>8 ? imgs.shift() : null;
  chapterStart[c.k]=slides.length;
  const pics = second ? `<div class="duo">${cell(hero)}${cell(second)}</div>` : `<div class="side-img">${cell(hero)}</div>`;
  add(c.tone+' opener', `<div class="num">${num}</div>${pics}
   <div class="txt"><div class="mono">Capítulo ${num} · ${c.t}</div><h2>${c.h}</h2>${c.p.map(x=>`<p>${x}</p>`).join('')}
   <div class="mono count">${(DATA[c.k]||[]).length} imagens</div></div>${foot(label)}`, label);
  // separate landscapes
  const L = imgs.filter(h=>h.endsWith('L')), P = imgs.filter(h=>!h.endsWith('L'));
  const bg = c.tone==='dark' ? 'dark' : (c.tone==='light'?'light':'cru');
  let pi = ci % PAT.length, part=1;
  const head = () => `<div class="head"><span>${label}</span><span>${c.h}</span></div>`;
  while(P.length){
    let [cls,n]=PAT[pi % PAT.length]; pi++;
    if(P.length<n){
      const r=P.length;
      cls = r>=10?'g10': r>=8?'g8': r>=6?'g6': r===5?'g5': r===4?'g4': r===3?'tri': r===2?'w2':'w2';
      n=r;
    }
    const chunk=P.splice(0,n);
    add(bg, `${head()}<div class="grid ${cls}" ${chunk.length===1?'style="grid-template-columns:1fr;left:400px;right:400px"':''}>${chunk.map(cell).join('')}</div>${foot(label)}`, label);
  }
  while(L.length){
    const n = L.length>=4?4 : L.length;
    const chunk=L.splice(0,n);
    const cls = n===4?'w4': n===3?'w3':'w2';
    add(bg, `${head()}<div class="grid ${cls}" ${n===1?'style="left:240px;right:240px"':''}>${chunk.map(cell).join('')}</div>${foot(label)}`, label);
  }
});

// ---- Closing
add('light', `<div class="head"><span>Síntese</span><span>O que fica de fora</span></div>
 <div class="txt" style="top:150px;width:640px"><div class="mono">Síntese</div><h2>O que este universo recusa</h2>
 <p>Arquitetura genérica e projetos com cara de catálogo. A estética do excesso e da ostentação. Conteúdo raso e tendências passageiras. Ambientes que fotografam bem e acolhem pouco.</p>
 <p>Tudo o que entra precisa ter matéria, tempo e intenção.</p></div>
 <div class="duo">${cell(DATA['moods'][5])}${cell(DATA['interiores'][7])}</div>${foot('Síntese')}`, 'Síntese');
add('dark', `<div class="cover-txt"><div class="mono">Nicolle Nogueira Studio</div><div class="rule"></div>
 <h1 style="font-size:96px">Casa, matéria<br><em>e sensação</em></h1><div class="rule"></div>
 <div class="mono sub">Curitiba · Brasil</div></div>`, 'Fim');

// ---- engine
let cur=0;
function load(i){ const s=slides[i]; if(!s) return; s.el.querySelectorAll('img[data-src]').forEach(im=>{ im.onload=()=>im.classList.add('ok'); im.onerror=()=>{im.closest('.cell').style.display='none'}; im.src=im.dataset.src; im.removeAttribute('data-src'); }); }
function go(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  slides[cur].el.classList.remove('on'); cur=i; slides[cur].el.classList.add('on');
  for(let k=i-1;k<=i+3;k++) load(k);
  document.getElementById('hint').style.opacity=cur===0?.7:0;
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  try{ history.replaceState(null,'','#'+(cur+1)); }catch(e){}
}
function fit(){ const s=Math.min(innerWidth/1600, innerHeight/900); deck.style.transform=`scale(${s})`; }
addEventListener('resize',fit); fit();
addEventListener('keydown',e=>{
  if(document.getElementById('lb').classList.contains('on')){ if(e.key==='Escape'||e.key===' ') closeLb(); return; }
  if(['ArrowRight','PageDown',' ','ArrowDown'].includes(e.key)){e.preventDefault();go(cur+1);}
  else if(['ArrowLeft','PageUp','ArrowUp'].includes(e.key)){e.preventDefault();go(cur-1);}
  else if(e.key==='Home') go(0); else if(e.key==='End') go(slides.length-1);
  else if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
let tx=null; addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{ if(tx===null) return; const d=e.changedTouches[0].clientX-tx; if(Math.abs(d)>40) go(cur+(d<0?1:-1)); tx=null; });
const lb=document.getElementById('lb');
function closeLb(){ lb.classList.remove('on'); }
lb.onclick=closeLb;
deck.addEventListener('click',e=>{
  const a=e.target.closest('a[data-ch]'); if(a){ go(chapterStart[a.dataset.ch]); return; }
  const c=e.target.closest('.cell[data-h]'); if(c){ const im=c.querySelector('img'); lb.querySelector('img').src=im.src; lb.classList.add('on'); }
});
const start=parseInt(location.hash.slice(1)); go(isNaN(start)?0:start-1);
</script>
